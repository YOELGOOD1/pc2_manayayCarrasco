<div class="container mt-4">
  <h2>Reporte de Estudiantes</h2>
  <table class="table table-bordered table-striped mt-3">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Nota 1</th>
        <th>Nota 2</th>
        <th>Nota 3</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let est of estudiantes">
        <td>{{ est.id }}</td>
        <td>{{ est.nombre }}</td>
        <td>{{ est.nota1 }}</td>
        <td>{{ est.nota2 }}</td>
        <td>{{ est.nota3 }}</td>
        <td>
          <button class="btn btn-primary btn-sm" (click)="verDetalle(est)">Detalle</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
